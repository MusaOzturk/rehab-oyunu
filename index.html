<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Mobil Rehab Oyunu</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #1e2227; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        #gameCanvas { 
            width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); 
        }
        #uiLayer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; 
        }
        #startBtn { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            padding: 18px 40px; font-size: 22px; font-weight: bold; background-color: #007acc; 
            color: white; border: none; border-radius: 50px; cursor: pointer; pointer-events: auto;
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.3);
        }
        .info { 
            position: absolute; font-size: 24px; font-weight: bold; padding: 15px; 
            text-shadow: 2px 2px 4px #000; 
        }
        #roundInfo { top: 10px; left: 10px; color: #f1c40f; }
        #targetInfo { top: 40px; left: 10px; color: #2ecc71; }
        #livesInfo { top: 10px; right: 10px; color: #e74c3c; }
        
        #messageBox {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.85); padding: 40px; border-radius: 20px; text-align: center;
        }
        .btn-restart {
            padding: 12px 25px; font-size: 20px; border-radius: 10px; pointer-events: auto;
            background-color: #3498db; color: white; border: none; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
    <video id="input_video" style="display: none;" playsinline autoplay muted></video>
    <canvas id="gameCanvas"></canvas>
    
    <div id="uiLayer">
        <div id="roundInfo" class="info" style="display: none;">ROUND: 1</div>
        <div id="targetInfo" class="info" style="display: none;">HEDEF: 0 / 10</div>
        <div id="livesInfo" class="info" style="display: none;">CAN: ❤️❤️❤️</div>
        
        <button id="startBtn">Kamerayı Aç ve Başla</button>
        
        <div id="messageBox">
            <h1 id="messageTitle" style="color: #2ecc71; margin: 0; font-size: 36px;">TEBRİKLER!</h1>
            <h2 id="messageSubtitle" style="color: #fff; margin: 20px 0;">ROUND 2 BAŞLIYOR...</h2>
            <button id="restartBtn" class="btn-restart" onclick="location.reload()" style="display: none;">Tekrar Oyna</button>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('gameCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const roundDiv = document.getElementById('roundInfo');
        const targetDiv = document.getElementById('targetInfo');
        const livesDiv = document.getElementById('livesInfo');
        const messageBox = document.getElementById('messageBox');
        const messageTitle = document.getElementById('messageTitle');
        const messageSubtitle = document.getElementById('messageSubtitle');
        const restartBtn = document.getElementById('restartBtn');

        let gameState = "START";
        let currentRound = 1;
        let targetsCollected = 0;
        let targetGoal = 10;
        let lives = 3;
        let balls = [];

        function spawnBall() {
            if(gameState === "GAMEOVER") return;
            
            if(gameState === "PLAYING") {
                const radius = Math.random() * 15 + 30; // Topları biraz daha büyük yaptık (görünürlük için)
                const x = Math.random() * (canvasElement.width - radius * 2) + radius;
                const isTarget = Math.random() > 0.3; // %70 Yeşil
                
                // HIZ DÜŞÜRÜLDÜ: Başlangıç hızı 2, round başına sadece 0.5 artıyor
                const baseSpeed = 2.0 + (currentRound * 0.5); 
                
                balls.push({
                    x: x, y: -radius, radius: radius,
                    speed: Math.random() * 1.5 + baseSpeed, 
                    isTarget: isTarget,
                    color: isTarget ? '#2ecc71' : '#e74c3c' // Hedef YEŞİL, Tuzak KIRMIZI
                });
            }
            
            // GELME SIKLIĞI AZALTILDI: Daha seyrek aralıklarla düşecekler
            let spawnRate = Math.max(800, 2000 - (currentRound * 200));
            setTimeout(spawnBall, spawnRate);
        }

        function handleRoundComplete() {
            gameState = "TRANSITION";
            balls = [];
            currentRound++;
            targetsCollected = 0;
            targetGoal += 5;
            
            messageTitle.style.color = "#2ecc71";
            messageTitle.innerText = "TEBRİKLER!";
            messageSubtitle.innerText = "ROUND " + currentRound + " BAŞLIYOR...";
            messageBox.style.display = 'block';
            restartBtn.style.display = 'none';

            setTimeout(() => {
                messageBox.style.display = 'none';
                updateUI();
                gameState = "PLAYING";
            }, 3000);
        }

        function gameOver() {
            gameState = "GAMEOVER";
            balls = [];
            messageTitle.style.color = "#e74c3c";
            messageTitle.innerText = "OYUN BİTTİ!";
            messageSubtitle.innerText = "Ulaştığın Seviye: ROUND " + currentRound;
            messageBox.style.display = 'block';
            restartBtn.style.display = 'inline-block';
        }

        function updateUI() {
            roundDiv.innerText = "ROUND: " + currentRound;
            targetDiv.innerText = "HEDEF: " + targetsCollected + " / " + targetGoal;
            livesDiv.innerText = "CAN: " + "❤️".repeat(lives);
        }

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if(gameState !== "PLAYING") { canvasCtx.restore(); return; }

            let hands = [];
            if (results.poseLandmarks) {
                const leftHand = results.poseLandmarks[19];
                const rightHand = results.poseLandmarks[20];
                
                if(leftHand.visibility > 0.5) hands.push({x: leftHand.x * canvasElement.width, y: leftHand.y * canvasElement.height});
                if(rightHand.visibility > 0.5) hands.push({x: rightHand.x * canvasElement.width, y: rightHand.y * canvasElement.height});
                
                canvasCtx.fillStyle = 'rgba(52, 152, 219, 0.7)';
                for(let h of hands) {
                    canvasCtx.beginPath();
                    canvasCtx.arc(h.x, h.y, 25, 0, 2 * Math.PI);
                    canvasCtx.fill();
                    canvasCtx.strokeStyle = 'white';
                    canvasCtx.lineWidth = 3;
                    canvasCtx.stroke();
                }
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                let b = balls[i];
                b.y += b.speed;
                
                let hit = false;
                for(let h of hands) {
                    let dist = Math.hypot(h.x - b.x, h.y - b.y);
                    if(dist < b.radius + 25) { 
                        hit = true;
                        if(b.isTarget) {
                            targetsCollected += 1;
                            if(targetsCollected >= targetGoal) {
                                handleRoundComplete();
                                canvasCtx.restore();
                                return;
                            }
                        } else {
                            lives -= 1;
                            if(lives <= 0) {
                                gameOver();
                                canvasCtx.restore();
                                return;
                            }
                        }
                        break;
                    }
                }

                if(hit || b.y > canvasElement.height + b.radius) {
                    balls.splice(i, 1);
                } else {
                    canvasCtx.beginPath();
                    canvasCtx.arc(b.x, b.y, b.radius, 0, 2 * Math.PI);
                    canvasCtx.fillStyle = b.color;
                    canvasCtx.fill();
                    canvasCtx.lineWidth = 3;
                    canvasCtx.strokeStyle = 'white';
                    canvasCtx.stroke();
                }
            }

            updateUI();
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                
                videoElement.srcObject = stream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    
                    startBtn.style.display = 'none';
                    roundDiv.style.display = 'block';
                    targetDiv.style.display = 'block';
                    livesDiv.style.display = 'block';
                    
                    gameState = "PLAYING";
                    updateUI();
                    setTimeout(spawnBall, 2000);
                    
                    async function processVideoFrame() {
                        if (gameState !== "GAMEOVER") {
                            await pose.send({image: videoElement});
                            requestAnimationFrame(processVideoFrame);
                        }
                    }
                    processVideoFrame();
                };
            } catch (err) {
                alert("KAMERA AÇILAMADI!\n\nSebep: " + err.message + "\n\nLütfen tarayıcınızın ayarlarına gidip bu sitenin kameraya erişmesine izin verin veya sayfayı yenileyip tekrar deneyin.");
            }
        });
    </script>
</body>
</html>
